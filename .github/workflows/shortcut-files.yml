name: Build visual Quaderno Salute
on:
  push:
    branches: [salute-shortcut-files]
    paths: ['Core/**', 'App/**', 'Tests/**', 'UITests/**', 'project*.json', '.github/workflows/shortcut-files.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge:
    if: ${{ !contains(github.event.head_commit.message, '[ui-only]') }}
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Core and shortcut codec tests
        run: |
          set -o pipefail
          swift test --parallel 2>&1 | tee shortcut-core-tests.log
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate base iPhone app
        run: xcodegen generate --spec project.json
      - name: Build app without HealthKit entitlement
        run: |
          set -o pipefail
          xcodebuild build -project AbitudiniLocale.xcodeproj -scheme AbitudiniLocale -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/bridge CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee build-bridge.log
      - name: Package iPhone update
        run: |
          mkdir -p build/package/Payload
          cp -R build/bridge/Build/Products/Release-iphoneos/AbitudiniLocale.app build/package/Payload/
          python3 - <<'PY'
          import plistlib,pathlib
          app=pathlib.Path('build/package/Payload/AbitudiniLocale.app')
          p=plistlib.loads((app/'Info.plist').read_bytes())
          assert p['CFBundleVersion']=='15' and p['CFBundleIdentifier']=='local.abitudinilocale.habits'
          PY
          cd build/package
          zip -qry ../QuadernoSalute-v15-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: QuadernoSalute-v15-IPA
          path: build/QuadernoSalute-v15-unsigned.ipa
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QuadernoSalute-v15-verification
          path: |
            shortcut-core-tests.log
            build-bridge.log
          retention-days: 7

  ui:
    if: ${{ !contains(github.event.head_commit.message, '[core-only]') }}
    name: Bullet journal and habit UI verification
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate and select simulator
        timeout-minutes: 8
        run: |
          xcodegen generate --spec project.json
          python3 scripts/select_simulator.py >> "$GITHUB_ENV"
      - name: Compile native app and UI tests
        timeout-minutes: 12
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project AbitudiniLocale.xcodeproj -scheme AbitudiniLocale -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO | tee build-ui-compile.log
      - name: Boot simulator before UI test
        timeout-minutes: 8
        run: |
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          open -a Simulator --args -CurrentDeviceUDID "$SIMULATOR_ID"
      - name: Native UI tests
        timeout-minutes: 15
        run: |
          set -o pipefail
          xcodebuild test-without-building -project AbitudiniLocale.xcodeproj -scheme AbitudiniLocale -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO -derivedDataPath build/simulator -resultBundlePath build/UITests.xcresult CODE_SIGNING_ALLOWED=NO | tee build-ui.log
      - name: Export test screenshots
        if: ${{ !cancelled() }}
        run: |
          mkdir -p build/screenshots
          if [ -d build/UITests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/UITests.xcresult --output-path build/screenshots
          fi
      - name: Collect app crash diagnostics
        timeout-minutes: 2
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: |
          mkdir -p build/diagnostics
          xcrun simctl spawn "$SIMULATOR_ID" log show --last 15m --style compact --predicate 'process == "AbitudiniLocale"' > build/diagnostics/app-runtime.log 2>&1 || true
          python3 - <<'PY'
          import pathlib, shutil
          source = pathlib.Path.home() / 'Library/Logs/DiagnosticReports'
          for path in source.glob('AbitudiniLocale*.ips'):
              shutil.copy2(path, pathlib.Path('build/diagnostics') / path.name)
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: AbitudiniLocale-UI-verification
          path: |
            build/screenshots
            build-ui.log
            build-ui-compile.log
            build/diagnostics
          retention-days: 7
