name: Build Quaderno Locale
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'VERIFICA.json']
permissions:
  contents: read
concurrency:
  group: quaderno-${{ github.ref }}
  cancel-in-progress: true
jobs:
  base:
    name: Import engine tests and native iPhone app
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Core tests with fictional backups
        run: |
          set -o pipefail
          swiftc -frontend -parse App/*.swift Core/*.swift Shared/*.swift
          swift test --parallel 2>&1 | tee core-tests.log
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project.json
      - name: Build native iPhone app
        run: |
          set -o pipefail
          xcodebuild build -project AbitudiniLocale.xcodeproj -scheme AbitudiniLocale -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/base CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee build-base.log
      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/base/Build/Products/Release-iphoneos/AbitudiniLocale.app build/Payload/
          cd build
          zip -qry QuadernoLocale-Base-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: QuadernoLocale-Base-IPA
          path: build/QuadernoLocale-Base-unsigned.ipa
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: AbitudiniLocale-build-logs
          path: |
            build-base.log
            core-tests.log
          retention-days: 7
  ui:
    name: Native study and service UI verification
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate and select simulator
        timeout-minutes: 8
        run: |
          xcodegen generate --spec project.json
          python3 scripts/select_simulator.py >> "$GITHUB_ENV"
      - name: Compile native app and UI tests
        timeout-minutes: 12
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project AbitudiniLocale.xcodeproj -scheme AbitudiniLocale -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO | tee build-ui-compile.log
      - name: Boot simulator before UI test
        timeout-minutes: 8
        run: |
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          open -a Simulator --args -CurrentDeviceUDID "$SIMULATOR_ID"
      - name: Native UI tests
        timeout-minutes: 15
        run: |
          set -o pipefail
          xcodebuild test-without-building -project AbitudiniLocale.xcodeproj -scheme AbitudiniLocale -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO -derivedDataPath build/simulator -resultBundlePath build/UITests.xcresult CODE_SIGNING_ALLOWED=NO | tee build-ui.log
      - name: Export test screenshots
        if: ${{ !cancelled() }}
        run: |
          mkdir -p build/screenshots
          if [ -d build/UITests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/UITests.xcresult --output-path build/screenshots
          fi
      - name: Collect app crash diagnostics
        if: ${{ !cancelled() }}
        run: |
          mkdir -p build/diagnostics
          xcrun simctl spawn "$SIMULATOR_ID" log show --last 15m --style compact --predicate 'process == "AbitudiniLocale"' > build/diagnostics/app-runtime.log 2>&1 || true
          python3 - <<'PY'
          import pathlib, shutil
          source = pathlib.Path.home() / 'Library/Logs/DiagnosticReports'
          for path in source.glob('AbitudiniLocale*.ips'):
              shutil.copy2(path, pathlib.Path('build/diagnostics') / path.name)
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: AbitudiniLocale-UI-verification
          path: |
            build/screenshots
            build-ui.log
            build-ui-compile.log
            build/diagnostics
          retention-days: 7
  watch:
    name: Native Watch companion and capture complication
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate Watch project
        run: xcodegen generate --spec project-watch.json
      - name: Compile paired iPhone and Watch bundle
        run: |
          set -o pipefail
          xcodebuild build -project AbitudiniLocale.xcodeproj -scheme AbitudiniLocale -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/watch CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee build-watch.log
      - name: Package companion IPA
        run: |
          mkdir -p build/watch-package/Payload
          cp -R build/watch/Build/Products/Release-iphoneos/AbitudiniLocale.app build/watch-package/Payload/
          cd build/watch-package
          zip -qry ../QuadernoLocale-Watch-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: QuadernoLocale-Watch-IPA
          path: build/QuadernoLocale-Watch-unsigned.ipa
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: QuadernoLocale-Watch-logs
          path: build-watch.log
          retention-days: 7
